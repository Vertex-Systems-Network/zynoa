name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint, typecheck, unit tests, build
        run: pnpm turbo run lint typecheck test build

      - name: Migration check
        # Runs every workspace's `db:check` script (drizzle-kit check). No-op until packages/db exists (WU-P0-05).
        run: pnpm turbo run db:check

      - name: Generated design tokens are up to date
        run: pnpm tokens:check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan git history for secrets
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep (product code)
        # ANPOS governance code under scripts/ and tests/ is covered by its own validators.
        # p/default is fetched from the Semgrep registry each run, so findings can change without a repo change.
        run: semgrep scan --config p/default --metrics=off --error --exclude "**/dist/**" apps packages

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy vulnerability scan (lockfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0

  container-build:
    # Not yet a required check: becomes one once the image proves stable across a few PRs.
    name: container-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t zynoa-api:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zynoa-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0

      - name: Smoke-run the image (healthz)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name api -p 4000:4000             -e APP_ENV=ci -e APP_URL=http://localhost:4000             -e DATABASE_URL=postgres://x:x@localhost:5432/x             -e REDIS_URL=redis://localhost:6379             -e TEMPORAL_ADDRESS=localhost:7233             zynoa-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/healthz > /dev/null && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  db-integration:
    # Real-Postgres tenant-isolation suite (packages/db test/integration). Uses the same
    # image and role bootstrap as infra/docker, so CI proves what local compose runs.
    name: db-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zynoa
          POSTGRES_DB: zynoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zynoa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles (same script as local compose)
        env:
          PGPASSWORD: zynoa
        run: psql -h localhost -U postgres -d zynoa -v ON_ERROR_STOP=1 -f infra/docker/postgres-init/01-roles.sql

      - name: Build db/auth packages and dependencies
        run: pnpm turbo run build --filter @zynoa/db... --filter @zynoa/auth...

      - name: Run tenant-isolation integration tests
        env:
          DATABASE_URL: postgres://zynoa:zynoa@localhost:5432/zynoa
          DATABASE_PLATFORM_URL: postgres://zynoa_platform:zynoa@localhost:5432/zynoa
        run: pnpm --filter @zynoa/db test:integration

      - name: Run sign-up integration tests (US-101)
        env:
          DATABASE_URL: postgres://zynoa:zynoa@localhost:5432/zynoa
          DATABASE_PLATFORM_URL: postgres://zynoa_platform:zynoa@localhost:5432/zynoa
        run: pnpm --filter @zynoa/auth test:integration
