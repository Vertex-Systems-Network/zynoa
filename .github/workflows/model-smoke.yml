name: Model smoke

# WU-P0-11 / Gate A exit item: call a real model through the gateway and print
# tokens + cost. Manual only — never on a schedule or on push, and it deploys
# nothing. Requires the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    name: model-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the gateway and its workspace dependencies
        run: pnpm exec turbo run build --filter=@zynoa/model-gateway

      - name: Run the gateway smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @zynoa/model-gateway smoke
