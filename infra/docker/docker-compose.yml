# Zynoa local development infrastructure (WU-P0-02, spec US-002).
# Start from the repo root:  docker compose up -d --wait   (root compose.yaml includes this file)
# Ports and first-run steps: infra/docker/README.md
name: zynoa

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: zynoa
      POSTGRES_PASSWORD: zynoa
      POSTGRES_DB: zynoa
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the zynoa_platform role (RLS bypass for migrations) and the vector extension.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynoa -d zynoa"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    # Temporal dev server: server (7233) + Web UI (8233) in one container, persisted to a volume.
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233" # gRPC (TEMPORAL_ADDRESS=localhost:7233)
      - "8233:8233" # Web UI (http://localhost:8233)
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 24

  seaweedfs:
    # S3-compatible object storage. MinIO (named in the spec) was abandoned upstream in late 2025;
    # see docs/decisions/ADR-015-local-s3-seaweedfs.md.
    image: chrislusf/seaweedfs:4.12
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:9000" # S3 endpoint (S3_ENDPOINT=http://localhost:9000)
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  seaweedfs-init:
    # One-shot: creates the two buckets from .env.example, then exits.
    image: chrislusf/seaweedfs:4.12
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 's3.bucket.create -name zynoa-private\ns3.bucket.create -name zynoa-public\n' | weed shell -master seaweedfs:9333
    restart: "no"

  mailpit:
    # Captures every outgoing email locally. UI: http://localhost:8025, SMTP: localhost:1025.
    image: axllent/mailpit:v1.31.5
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  valkey-data:
  temporal-data:
  seaweedfs-data:
